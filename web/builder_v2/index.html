<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/core/media/ui/saus_logo.png">
    <title>SAUS App Builder</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #181b1d; overflow: hidden; }
        #comfy { display: block; width: 100%; height: 100%; border: 0; }
        #hint {
            position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10;
            background: rgba(20, 20, 24, 0.94); color: #cba3e5; border: 1px solid #320848;
            border-radius: 8px; padding: 9px 16px; font: 12px Arial, Helvetica, sans-serif;
            max-width: 80vw; text-align: center;
        }
        #hint b { color: #fff; }
        #hint.err { border-color: #c62828; color: #ffb4b4; }
    </style>
</head>
<body>
    <!--
        The SAUS App Builder deliberately contains NO graph code of its own.
        It embeds the real ComfyUI frontend, which already draws the workflow
        graph and already loads the SAUS extension (web/core/js/common/scripts/
        sausAppBuilder.js via WEB_DIRECTORY). That extension adds the
        "SAUS Builder" button and the 3-step panel (inputs -> outputs -> preview).
    -->
    <iframe id="comfy" src="/" allow="clipboard-write; clipboard-read"></iframe>
    <div id="hint">App Builder — drop your workflow on the canvas, then click <b>SAUS Builder</b> in the top bar.</div>
    <script>
        // Hide the hint once the SAUS extension is live inside the embedded ComfyUI.
        (function () {
            const frame = document.getElementById('comfy');
            const hint = document.getElementById('hint');
            let tries = 0;
            const timer = setInterval(function () {
                tries++;
                try {
                    const w = frame.contentWindow;
                    if (w && w.__sausAppBuilder) {
                        hint.style.display = 'none';
                        clearInterval(timer);
                        return;
                    }
                } catch (e) { /* ignore */ }
                if (tries >= 60) {
                    clearInterval(timer);
                    hint.classList.add('err');
                    hint.innerHTML = 'SAUS extension not detected inside ComfyUI. ' +
                        'Reload ComfyUI once so it picks up <code>sausAppBuilder.js</code>, ' +
                        'or open the browser console and run <b>__sausAppBuilder.open()</b>.';
                }
            }, 500);
        })();
    </script>
</body>
</html>
