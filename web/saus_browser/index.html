<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAUS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="/core/media/ui/saus_logo.png" type="image/png">
    <link rel="stylesheet" href="saus/css/styles.css">

    <!-- Show the remembered theme before the first paint (see core/css/themes.css).
         Night is what :root already gives, so only Day and Fire need setting. -->
    <script>
        try {
            const theme = localStorage.getItem('SausTheme');
            if (theme === 'day' || theme === 'fire') {
                document.documentElement.dataset.theme = theme;
            }
        } catch (error) { /* storage blocked: keep the default */ }
    </script>

</head>
<body>
    <div class="container">
        <div class="main-wrapper">
            <div class="app-shell" id="appShell">
                <!-- Always visible icon rail -->
                <nav class="side-rail" id="sideRail" aria-label="Sections"></nav>

                <!-- Explorer panel: opened by clicking a rail icon -->
                <aside class="side-panel" id="sidePanel">
                    <div class="side-panel-head">
                        <!-- Search + filters sit above the title so the controls are
                             always in reach; the title hides while filtering. -->
                        <div class="panel-head-tools">
                            <div id="search-container">
                                <input type="text" id="searchInput" placeholder="Search apps..." autocomplete="off">
                                <i class="fas fa-times-circle clear-search"></i>
                            </div>
                            <button type="button" class="panel-tags-btn" id="tagsToggle" title="Filter by tags">
                                <i class="fas fa-tags"></i>
                                <span class="filters-badge hidden" id="filtersBadge">0</span>
                            </button>
                        </div>
                        <!-- The favourite apps, pinned between the search field
                             and the section (category) name. -->
                        <div id="favoritesSection" class="favorites-section hidden">
                            <div class="favorites-head">Favorites</div>
                            <div id="favoritesList" class="favorites-list"></div>
                        </div>
                        <div class="panel-head-top">
                            <span class="side-panel-title" id="sidePanelTitle">Apps</span>
                        </div>
                        <div id="tagsContainer" class="tags-container hidden">
                            <!-- Tag chips are added here -->
                        </div>
                    </div>
                    <div class="explorer" id="explorer"></div>
                </aside>

                <!-- Tabs + the panes they show -->
                <section class="workspace">
                    <div class="tab-strip hidden" id="tabStrip"></div>
                    <div class="panes" id="paneContainer">
                        <div id="homeContainer" class="pane home-container">
                            <div class="home-content">
                                <h1>Welcome to SAUS</h1>
                                <h3 style="text-align: center;">A Simple App U See</h3>
                                <img src="/core/media/ui/Saus%20quick%20start%20card.png" alt="Quick Start" style="max-width: 100%; max-height: 55vh; height: auto; margin: 20px 0;">
                                <h4 style="font-size: 1.1em; text-align: center;">Click one of the icons on the left to browse the apps.</h4>
                                <h4 style="font-size: 1.1em; text-align: center;">Every app you open stays here as a tab.</h4>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div><!--container-->
    <script type="module">
        import { initializeUI } from '/saus/js/main.js';
        document.addEventListener('DOMContentLoaded', () => {
            initializeUI();
        });
    </script>
</body>
</html>
