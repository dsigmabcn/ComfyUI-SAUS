<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAUS</title>
    <!-- Font Awesome, served from /core (web/core/media/vendor/fontawesome/).
         It used to come from cdnjs: the only cross-origin, render-blocking request
         in the UI, and the one thing that could hang on a slow or offline box.
         Re-vendor on a version bump: tools/vendor_fontawesome.py. -->
    <link href="/core/media/vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="/core/media/ui/saus_logo.png" type="image/png">

    <!-- One link per stylesheet, in the order the old `styles.css` @import chain
         applied them. The browser now discovers them all in the first pass instead
         of parsing ~13 sheets one after another before the first paint. -->
    <link rel="stylesheet" href="saus/css/variables.css">
    <link rel="stylesheet" href="saus/css/base.css">
    <link rel="stylesheet" href="saus/css/home.css">
    <link rel="stylesheet" href="saus/css/shell.css">
    <link rel="stylesheet" href="saus/css/explorer.css">
    <link rel="stylesheet" href="saus/css/controls.css">
    <link rel="stylesheet" href="saus/css/details.css">
    <link rel="stylesheet" href="saus/css/updates.css">
    <link rel="stylesheet" href="saus/css/settings.css">
    <link rel="stylesheet" href="saus/css/managers.css">
    <link rel="stylesheet" href="saus/css/modals.css">
    <link rel="stylesheet" href="/core/css/notices.css">

    <!-- Show the remembered theme before the first paint (see core/css/themes.css).
         Night is what :root already gives, so only Day and Fire need setting. -->
    <script>
        try {
            const theme = localStorage.getItem('SausTheme');
            if (theme === 'day' || theme === 'fire') {
                document.documentElement.dataset.theme = theme;
            }
        } catch (error) { /* storage blocked: keep the default */ }
    </script>

</head>
<body>
    <div class="container">
        <div class="main-wrapper">
            <div class="app-shell" id="appShell">
                <!-- Always visible icon rail -->
                <nav class="side-rail" id="sideRail" aria-label="Sections"></nav>

                <!-- Explorer panel: opened by clicking a rail icon -->
                <aside class="side-panel" id="sidePanel">
                    <div class="side-panel-head">
                        <!-- Search + filters sit above the title so the controls are
                             always in reach; the title hides while filtering. -->
                        <div class="panel-head-tools">
                            <div id="search-container">
                                <input type="text" id="searchInput" placeholder="Search apps..." autocomplete="off">
                                <i class="fas fa-times-circle clear-search"></i>
                            </div>
                            <button type="button" class="panel-tags-btn" id="tagsToggle" title="Filter by tags">
                                <i class="fas fa-tags"></i>
                                <span class="filters-badge hidden" id="filtersBadge">0</span>
                            </button>
                        </div>
                        <!-- The favourite apps, pinned between the search field
                             and the section (category) name. -->
                        <div id="favoritesSection" class="favorites-section hidden">
                            <div class="favorites-head">Favorites</div>
                            <div id="favoritesList" class="favorites-list"></div>
                        </div>
                        <div class="panel-head-top">
                            <span class="side-panel-title" id="sidePanelTitle">Apps</span>
                        </div>
                        <div id="tagsContainer" class="tags-container hidden">
                            <!-- Tag chips are added here -->
                        </div>
                    </div>
                    <div class="explorer" id="explorer"></div>
                </aside>

                <!-- Tabs + the panes they show -->
                <section class="workspace">
                    <div class="tab-strip hidden" id="tabStrip"></div>
                    <div class="panes" id="paneContainer">
                        <div id="homeContainer" class="pane home-container">
                            <div class="home-content">
                                <h1>Welcome to SAUS</h1>
                                <h3>A Simple App U See</h3>
                                <!-- Sized by home.css: this card must keep its 16:9 shape
                                     whatever the window (or the console dock) does. -->
                                <img src="/core/media/ui/Saus%20quick%20start%20card.webp"
                                     alt="Quick start: choose a category, install the models, open the app, set the prompt and run"
                                     width="1366" height="768" decoding="async">
                            </div>
                        </div>
                    </div>

                    <!-- The console docks over the bottom of the workspace; the
                         panes keep their size (see console.js). The grip on the
                         top edge is the divider: only it resizes the dock. -->
                    <div class="console-dock hidden" id="consoleDock">
                        <div class="console-dock-grip" id="consoleDockGrip" role="separator"
                             aria-orientation="horizontal" aria-label="Resize the console"
                             tabindex="0" title="Drag to resize the console"></div>
                        <div class="console-dock-body" id="consoleDockBody"></div>
                    </div>
                </section>
            </div>
        </div>
    </div><!--container-->
    <script type="module">
        import { initializeUI } from '/saus/js/main.js';
        document.addEventListener('DOMContentLoaded', () => {
            initializeUI();
        });
    </script>
</body>
</html>
