<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="/core/media/ui/saus_logo.png" type="image/png">
    <link rel="stylesheet" href="file_manager/css/styles.css?v=6">

    <!-- Show the remembered theme before the first paint (see core/css/themes.css).
         Night is what :root already gives, so only Day and Fire need setting. -->
    <script>
        try {
            const theme = localStorage.getItem('SausTheme');
            if (theme === 'day' || theme === 'fire') {
                document.documentElement.dataset.theme = theme;
            }
        } catch (error) { /* storage blocked: keep the default */ }
    </script>
</head>

<body>
    <div class="container">
        <header></header>

        <!-- Two panes: Input (left) and Output (right), plus the preview panel. -->
        <div class="fm-layout" id="fm-layout">

            <!-- INPUT -->
            <section class="fm-pane" data-pane="input">
                <div class="fm-head">
                    <button type="button" class="fm-up" data-act="up" title="Go up one folder"><i class="fas fa-arrow-up"></i></button>
                    <h2 class="fm-title"><i class="fas fa-folder-open"></i> <span class="fm-path" data-role="path">/input</span></h2>
                    <div class="fm-tools">
                        <button type="button" class="fm-btn" data-act="upload" title="Upload a file">
                            <i class="fas fa-upload"></i> Upload
                        </button>
                        <span class="fm-sep"></span>
                        <button type="button" class="fm-btn" data-act="newfolder" title="Create a folder here">
                            <i class="fas fa-folder-plus"></i>
                        </button>
                        <button type="button" class="fm-btn" data-act="rename" title="Rename selected file" disabled>
                            <i class="fas fa-pen"></i>
                        </button>
                        <button type="button" class="fm-btn" data-act="download" title="Download selected file(s)" disabled>
                            <i class="fas fa-download"></i>
                        </button>
                        <button type="button" class="fm-btn fm-danger" data-act="delete" title="Delete selected item(s)" disabled>
                            <i class="fas fa-trash"></i>
                        </button>
                        <span class="fm-sep"></span>
                        <span class="fm-views">
                            <button type="button" class="fm-view-btn" data-view="list" title="List view"><i class="fas fa-list"></i></button>
                            <button type="button" class="fm-view-btn" data-view="medium" title="Medium icons"><i class="fas fa-table-cells"></i></button>
                            <button type="button" class="fm-view-btn" data-view="large" title="Large icons"><i class="fas fa-table-cells-large"></i></button>
                        </span>
                    </div>
                </div>
                <div class="fm-list" data-role="list"></div>
            </section>

            <!-- OUTPUT -->
            <section class="fm-pane" data-pane="output">
                <div class="fm-head">
                    <button type="button" class="fm-up" data-act="up" title="Go up one folder"><i class="fas fa-arrow-up"></i></button>
                    <h2 class="fm-title"><i class="fas fa-folder-open"></i> <span class="fm-path" data-role="path">/output</span></h2>
                    <div class="fm-tools">
                        <button type="button" class="fm-btn" data-act="newfolder" title="Create a folder here">
                            <i class="fas fa-folder-plus"></i>
                        </button>
                        <button type="button" class="fm-btn" data-act="rename" title="Rename selected file" disabled>
                            <i class="fas fa-pen"></i>
                        </button>
                        <button type="button" class="fm-btn" data-act="download" title="Download selected file(s)" disabled>
                            <i class="fas fa-download"></i>
                        </button>
                        <button type="button" class="fm-btn fm-danger" data-act="delete" title="Delete selected item(s)" disabled>
                            <i class="fas fa-trash"></i>
                        </button>
                        <span class="fm-sep"></span>
                        <span class="fm-views">
                            <button type="button" class="fm-view-btn" data-view="list" title="List view"><i class="fas fa-list"></i></button>
                            <button type="button" class="fm-view-btn" data-view="medium" title="Medium icons"><i class="fas fa-table-cells"></i></button>
                            <button type="button" class="fm-view-btn" data-view="large" title="Large icons"><i class="fas fa-table-cells-large"></i></button>
                        </span>
                    </div>
                </div>
                <div class="fm-list" data-role="list"></div>
            </section>

            <!-- PREVIEW -->
            <aside class="fm-preview hidden" id="fm-preview">
                <div class="fm-preview-head">
                    <button type="button" class="fm-nav" data-act="prev" title="Previous file"><i class="fas fa-chevron-left"></i></button>
                    <span class="fm-preview-name" data-role="name"></span>
                    <button type="button" class="fm-nav" data-act="next" title="Next file"><i class="fas fa-chevron-right"></i></button>
                    <button type="button" class="fm-close" data-act="close" title="Close preview"><i class="fas fa-times"></i></button>
                </div>
                <div class="fm-preview-body" data-role="body"></div>
            </aside>
        </div>


        <!-- Hidden host for the Settings view. -->
        <div id="settings-host"></div>
    </div>

    <input type="file" id="hidden-upload" style="display: none;" />

    <!-- MODAL FOR DOWNLOAD FROM URL -->
    <div id="download-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <h2>URL to download file</h2>
            <input type="text" id="download-url" class="download-input" placeholder="Paste URL here" />
            <select id="token-source" class="download-input">
                <option value="none">No API Token</option>
                <option value="custom">Custom Token</option>
            </select>
            <input type="text" id="download-token" class="download-input hidden-initial"
                placeholder="Paste API Token here" />
            <button id="download-button" onclick="startDownload()">Download</button>
            <div id="download-status" class="download-status-message"></div>

            <div id="download-progress-container" class="progress-container hidden-initial">
                <div id="download-progress-label" class="progress-label">
                    Download progress
                </div>
                <div id="download-progress" class="progress-bar-base">
                    <div id="download-progress-bar" class="progress-bar-value">
                    </div>
                    <span id="download-progress-text" class="progress-text">
                    </span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="file_manager/js/main.js?v=6"></script>
</body>

</html>
